name: Sync Jira Epics

on:
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 1pm UTC (9am Eastern)
  workflow_dispatch:        # Allows manual runs from the Actions tab

permissions:
  contents: write           # Required to commit snapshot.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          EMAIL: ${{ secrets.JIRA_EMAIL }}
          API_KEY: ${{ secrets.JIRA_API_KEY }}
        run: python main.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git diff --cached --quiet || git commit -m "chore: update sync snapshot [skip ci]"
          git push
